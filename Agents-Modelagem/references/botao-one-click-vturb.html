<!-- Modelo do botão one-click Kirvano para CTA "HTML customizado" da Vturb (SKILL.md seção 4c).
     Trocar {{...}}. OFFER_ID = id da oferta na Kirvano. Upsell: REFUSE = página do downsell. Downsell: NEXT e REFUSE = login.
     Validado visualmente a 375px em 12/11/2026 (funil 7 Améns). -->
<style>
  .kv-wrap{box-sizing:border-box;width:100%;max-width:480px;margin:16px auto 0;padding:0 4px;text-align:center;font-family:inherit}
  .kv-sim{box-sizing:border-box;display:block;width:100%;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(180deg,#34d058 0%,#1e9e46 100%);color:#fff;border-radius:14px;padding:16px 14px;
    box-shadow:0 6px 0 #157a35,0 10px 22px rgba(0,0,0,.25);animation:kvPulse 1.6s ease-in-out infinite}
  .kv-sim:active{transform:translateY(3px);box-shadow:0 3px 0 #157a35,0 6px 14px rgba(0,0,0,.25)}
  .kv-t1{display:block;font-size:clamp(18px,5.4vw,24px);font-weight:900;line-height:1.15;text-transform:uppercase;letter-spacing:.2px}
  .kv-t2{display:block;margin-top:6px;font-size:clamp(12px,3.4vw,14px);font-weight:600;opacity:.95;line-height:1.3}
  .kv-nao{display:inline-block;margin:14px auto 4px;border:0;background:none;cursor:pointer;padding:6px;color:#9a9a9a;text-decoration:underline;font-size:11px;line-height:1.3;font-family:inherit}
  @keyframes kvPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @media (prefers-reduced-motion:reduce){.kv-sim{animation:none}}
</style>
<div class="kv-wrap">
  <button type="button" class="kirvano-payment-trigger kv-sim">
    <span class="kv-t1">✅ {{TEXTO_SIM}} 🙏</span>
    <span class="kv-t2">Adicionar ao meu pedido com 1 clique</span>
  </button>
  <button type="button" class="kirvano-refuse-trigger kv-nao">{{TEXTO_NAO}}</button>
</div>
<script>
  var offer = "{{OFFER_ID}}";
  var nextPageURL = "{{NEXT_PAGE_URL}}";
  var refusePageURL = "{{REFUSE_PAGE_URL}}";
</script>
<script src="https://snippets.kirvano.com/upsell.min.js"></script>
